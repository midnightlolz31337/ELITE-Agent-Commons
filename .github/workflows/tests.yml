name: Commons tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m elite_commons.cli validate
      - run: python -m unittest discover -s tests -v
      - name: Install wheel contents into an isolated target
        run: python -m pip install --no-deps --target "$RUNNER_TEMP/elite-commons-installed" .
      - name: Verify installed package outside the source tree
        run: cd "$RUNNER_TEMP" && PYTHONPATH="$RUNNER_TEMP/elite-commons-installed" python -m elite_commons.cli validate
      - name: Verify installed console entry point
        run: cd "$RUNNER_TEMP" && PYTHONPATH="$RUNNER_TEMP/elite-commons-installed" "$RUNNER_TEMP/elite-commons-installed/bin/elite-commons" validate
